name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.5'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Require locked package manifest
        run: |
          set -euo pipefail
          test -f composer.json
          test -f composer.lock

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish --no-check-all

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run package quality contract
        run: composer check

      - name: Verify fresh consumer-root installation
        shell: bash
        run: |
          set -euo pipefail
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          export COMPOSER_HOME="$consumer/composer-home"
          mkdir "$consumer/package"
          git archive HEAD | tar -x -C "$consumer/package"
          jq --arg package "$consumer/package" '. + {
            repositories: [{
              type: "path",
              url: $package,
              options: {
                symlink: false,
                versions: {"ran/coding-standards": "dev-under-test"}
              }
            }]
          }' tests/consumer.json > "$consumer/composer.json"
          composer --working-dir="$consumer" install --no-interaction --prefer-dist --no-progress
          for standard in RAN RANWordPress RANWordPressPlugin RANWordPressLibrary; do
            "$consumer/vendor/bin/phpcs" -e --standard="$standard"
          done

      - name: Lint repository PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './vendor' -prune -o -type f -name '*.php' -print0)

  quality:
    name: quality
    if: ${{ always() }}
    needs: verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require all PHP lanes
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
