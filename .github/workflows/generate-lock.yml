name: Generate lockfile

on:
  push:
    branches:
      - feat/initial-quality-package

permissions:
  contents: read

jobs:
  lock:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Resolve dependency graph and verify package
        run: |
          composer update --no-interaction --prefer-dist --no-progress
          composer check

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: lock
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download generated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composer-lock
          path: generated

      - name: Commit exact generated lockfile
        run: |
          set -euo pipefail
          cp generated/composer.lock composer.lock
          if [ -z "$(git status --porcelain -- composer.lock)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore: lock quality dependencies'
          git push origin HEAD:feat/initial-quality-package
